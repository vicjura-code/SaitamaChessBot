name: Launch Chess Bot
on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requirements
        run: |
          pip install requests python-chess
          pip install -r requirements.txt || true

      - name: Trigger Lichess Upgrade
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
        run: |
          curl -d '' https://lichess.org -H "Authorization: Bearer $LICHESS_TOKEN"
          
      - name: Start Engine Loop
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
        run: |
          python3 lichess-bot.py || python3 main.py || true
          
